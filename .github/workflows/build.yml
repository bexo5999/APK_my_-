name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          openjdk-11-jdk \
          git \
          zip \
          unzip \
          ffmpeg \
          autoconf \
          libtool \
          pkg-config

        pip install --upgrade pip setuptools wheel

        pip install \
          buildozer \
          cython==0.29.36


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install Android SDK packages
      run: |
        yes | sdkmanager --licenses || true

        sdkmanager \
          "platform-tools" \
          "platforms;android-28" \
          "build-tools;28.0.3"


    - name: Check Buildozer
      run: |
        buildozer --version


    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoToAudio-APK
        path: bin/*.apk
