name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          openjdk-11-jdk \
          git \
          zip \
          unzip \
          ffmpeg \
          autoconf \
          libtool \
          pkg-config

        pip install --upgrade pip setuptools wheel

        pip install \
          buildozer \
          cython==0.29.36


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Prepare Android SDK for Buildozer
      run: |
        mkdir -p $HOME/.buildozer/android/platform

        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk

        mkdir -p $ANDROIDSDK

        cp -r $ANDROID_HOME/* $ANDROIDSDK/ || true

        mkdir -p $ANDROIDSDK/tools/bin

        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          $ANDROIDSDK/tools/bin/sdkmanager

        yes | $ANDROIDSDK/tools/bin/sdkmanager --licenses || true

        $ANDROIDSDK/tools/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-28" \
          "build-tools;28.0.3"

        echo "ANDROIDSDK=$ANDROIDSDK" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROIDSDK" >> $GITHUB_ENV


    - name: Check Android Tools
      run: |
        ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools
        $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version


    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoToAudio-APK
        path: bin/*.apk
